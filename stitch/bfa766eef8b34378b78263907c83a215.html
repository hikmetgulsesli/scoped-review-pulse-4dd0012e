<style>
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(77, 142, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(77, 142, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(77, 142, 255, 0); }
        }

<body class="bg-background text-on-surface font-body-md h-screen flex items-center justify-center p-margin">
<!-- TopNavBar (Nav Shell Suppressed per brief, but implemented as requested if standalone component structure is needed, though brief says 'No navigation'. I will omit TopNav based on 'No navigation, profiles, or sidebars as per the brief.') -->
<!-- Main Dashboard Container -->
<main class="w-full max-w-3xl bg-surface-container border border-outline-variant rounded shadow-md overflow-hidden">
<!-- Header -->
<header class="flex justify-between items-center p-stack-default border-b border-outline-variant bg-surface-container-high">
<div class="flex items-center gap-stack-default">
<div class="w-2 h-2 rounded-full bg-primary pulse-dot"></div>
<h1 class="font-headline-md text-headline-md text-primary">Scoped Review Pulse</h1>
</div>
<!-- Toggle ACT_TOGGLE_STATUS -->
<label class="flex items-center cursor-pointer gap-stack-compact">
<div class="relative">
<input checked="" class="sr-only" type="checkbox"/>
<div class="block bg-surface-container-highest w-10 h-6 rounded-DEFAULT border border-outline-variant transition-colors duration-200"></div>
<div class="dot absolute left-1 top-1 bg-primary w-4 h-4 rounded-DEFAULT transition transform translate-x-4"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-2">Ready</span>
</label>
</header>
<!-- Content Area -->
<div class="p-stack-default flex flex-col gap-stack-default">
<!-- Status Section -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-stack-default">
<!-- Status Item 1 -->
<div class="bg-surface border border-outline-variant rounded p-stack-default flex flex-col gap-stack-compact hover:border-primary transition-colors">
<div class="flex justify-between items-center pb-stack-compact border-b border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">System Health</span>
<span class="material-symbols-outlined text-primary" style="font-size: 16px;">monitor_heart</span>
</div>
<div class="flex items-center gap-2 pt-1">
<span class="w-2 h-2 bg-green-500 rounded-full"></span>
<span class="font-code-md text-code-md text-on-surface">Operational</span>
</div>
</div>
<!-- Status Item 2 -->
<div class="bg-surface border border-outline-variant rounded p-stack-default flex flex-col gap-stack-compact hover:border-primary transition-colors">
<div class="flex justify-between items-center pb-stack-compact border-b border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Last Scan</span>
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 16px;">history</span>
</div>
<div class="flex items-center gap-2 pt-1">
<span class="font-code-md text-code-md text-on-surface-variant">14m ago</span>
</div>
</div>
<!-- Status Item 3 -->
<div class="bg-surface border border-outline-variant rounded p-stack-default flex flex-col gap-stack-compact hover:border-primary transition-colors">
<div class="flex justify-between items-center pb-stack-compact border-b border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Pulse Rate</span>
<span class="material-symbols-outlined text-green-500" style="font-size: 16px;">speed</span>
</div>
<div class="flex items-center gap-2 pt-1">
<span class="font-code-md text-code-md text-on-surface text-green-400">98%</span>
</div>
</div>
</section>
<!-- Control Section -->
<section class="flex flex-col sm:flex-row justify-between items-center bg-surface border border-outline-variant rounded p-stack-default mt-stack-compact">
<div class="flex items-center gap-stack-compact mb-stack-default sm:mb-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 18px;">schedule</span>
<span class="font-code-sm text-code-sm text-on-surface-variant" id="current-timestamp">2023-10-27 14:30:05 UTC</span>
</div>
<button class="flex items-center gap-2 bg-primary-container hover:bg-inverse-primary text-on-primary-container hover:text-white px-4 py-2 rounded-DEFAULT transition-colors border border-transparent h-[32px]">
<span class="material-symbols-outlined" style="font-size: 16px;">refresh</span>
<span class="font-body-sm text-body-sm font-semibold">Force Refresh</span>
</button>
</section>
<!-- Feedback Layer -->
<div class="flex items-center justify-center gap-2 pt-stack-compact">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 14px;">check_circle</span>
<span class="font-code-sm text-code-sm text-on-surface-variant">Local State: Synchronized</span>
</div>
</div>
</main>
<script>
        // Simple script to handle toggle visual state if needed, though pure CSS handles the layout mostly.
        document.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
            const dot = this.parentElement.querySelector('.dot');
            const bg = this.parentElement.querySelector('.block');
            const label = this.parentElement.parentElement.querySelector('span');
            
            if(this.checked) {
                dot.classList.add('translate-x-4');
                dot.classList.add('bg-primary');
                dot.classList.remove('bg-on-surface-variant');
                label.textContent = 'READY';
                label.classList.add('text-primary');
                label.classList.remove('text-on-surface-variant');
            } else {
                dot.classList.remove('translate-x-4');
                dot.classList.remove('bg-primary');
                dot.classList.add('bg-on-surface-variant');
                label.textContent = 'PAUSED';
                label.classList.remove('text-primary');
                label.classList.add('text-on-surface-variant');
            }
        });

        // Update timestamp
        function updateTime() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const timestamp = `${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())} ${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
            document.getElementById('current-timestamp').textContent = timestamp;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body></html>
